# Runs the image published to the registry. Site is exposed on port 5183.
# IMAGE is set by the CI/CD deploy step (e.g. ghcr.io/jiwe-holding/prima_africa:<sha>).
services:
  web:
    image: ${IMAGE:-ghcr.io/jiwe-holding/prima_africa:latest}
    container_name: prima-africa
    restart: unless-stopped
    ports:
      - "5183:80"
